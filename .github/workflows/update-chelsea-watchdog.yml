name: Chelsea tour watchdog

# Backup trigger: if chelsea-tour.json is older than 25 minutes, refresh it.
# Helps when the main schedule is delayed or skipped by GitHub.

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

concurrency:
  group: chelsea-tour-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check status age
        id: check
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/93zamogo-dotcom/fantasy-chelsea-widget/main/chelsea-tour.json"
          if ! curl -fsS "$URL" -o /tmp/chelsea-tour.json; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "age_sec=999999" >> "$GITHUB_OUTPUT"
            echo "File missing or unreachable — will refresh"
            exit 0
          fi
          AGE_SEC=$(python3 - <<'PY'
          import json, time
          data = json.load(open("/tmp/chelsea-tour.json"))
          age = time.time() - float(data.get("updated_at") or 0)
          print(int(age))
          PY
          )
          echo "age_sec=$AGE_SEC" >> "$GITHUB_OUTPUT"
          if [ "$AGE_SEC" -gt 1500 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Status is stale (${AGE_SEC}s) — will refresh"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Status is fresh (${AGE_SEC}s) — skip"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.stale == 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.check.outputs.stale == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Cache Playwright browser
        if: steps.check.outputs.stale == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install deps
        if: steps.check.outputs.stale == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Fetch Chelsea duel
        if: steps.check.outputs.stale == 'true'
        env:
          TEAM: Chelsea
          LEAGUE: Liga Surpresa
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "Fetch attempt $attempt"
            if python scraper/fetch_chelsea.py -o chelsea-tour.json; then
              ok=1
              break
            fi
            sleep $((attempt * 8))
          done
          test "$ok" -eq 1

      - name: Commit chelsea-tour.json
        if: steps.check.outputs.stale == 'true'
        run: |
          set -euo pipefail
          git config user.name "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          git add chelsea-tour.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh Chelsea tour status (watchdog)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1

      - name: Purge jsDelivr cache
        if: success() && steps.check.outputs.stale == 'true'
        continue-on-error: true
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/93zamogo-dotcom/fantasy-chelsea-widget@main/chelsea-tour.json" || true
